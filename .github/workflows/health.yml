# Uptime checks for the thultz.dev sites and services. A failed run makes GitHub email the owner.
# A check only counts as failed when it fails twice, 30 seconds apart.
name: Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check sites and services
        shell: bash
        run: |
          set -uo pipefail

          # name | url | kind
          #   page   : any 2xx
          #   json   : 200 with a JSON body
          #   ok     : 200 with JSON {"ok": true}
          #   status : 200 with Lantern's status JSON; a degraded service fails, an unknown one warns
          checks=(
            "Anvil|https://anvil.thultz.dev/|page"
            "Anvil models API|https://anvil.thultz.dev/api/ai/models|json"
            "Anvil AI service|https://anvil-ai-8sbo4.ondigitalocean.app/health|ok"
            "TurtleDeck|https://turtledeck.thultz.dev/|page"
            "TurtleDeck relay|https://lionfish-app-i8kz6.ondigitalocean.app/health|ok"
            "Lantern Hub|https://lantern.thultz.dev/|page"
            "Lantern status API|https://lantern.thultz.dev/api/status|status"
            "Lantern UI|https://ui.thultz.dev/|page"
            "thultz.dev|https://thultz.dev/|page"
          )

          declare -a result code secs detail note
          body=$(mktemp)

          probe() { # index -> fills result/code/secs/detail for that index
            local i=$1 name url kind out c t
            IFS='|' read -r name url kind <<< "${checks[$i]}"
            : > "$body"
            out=$(curl -sS -L -o "$body" -w '%{http_code} %{time_total}' \
                    --connect-timeout 5 --max-time 20 \
                    -H 'User-Agent: thultz-dev-health-check' "$url" 2>/dev/null)
            read -r c t <<< "${out:-000 0}"
            code[$i]=${c:-000}; secs[$i]=${t:-0}; result[$i]=ok; detail[$i]=""

            if [[ ${code[$i]} == 000 ]]; then
              result[$i]=fail; detail[$i]="no response (timeout or connection error)"; return
            fi
            case $kind in
              page)
                [[ ${code[$i]} == 2* ]] || { result[$i]=fail; detail[$i]="HTTP ${code[$i]}"; } ;;
              json)
                if [[ ${code[$i]} != 200 ]]; then result[$i]=fail; detail[$i]="HTTP ${code[$i]}"
                elif ! jq -e . "$body" > /dev/null 2>&1; then result[$i]=fail; detail[$i]="response is not JSON"; fi ;;
              ok)
                if [[ ${code[$i]} != 200 ]]; then result[$i]=fail; detail[$i]="HTTP ${code[$i]}"
                elif ! jq -e '.ok == true' "$body" > /dev/null 2>&1; then result[$i]=fail; detail[$i]="ok is not true"; fi ;;
              status)
                if [[ ${code[$i]} != 200 ]]; then result[$i]=fail; detail[$i]="HTTP ${code[$i]}"
                elif ! jq -e '.services | type == "array"' "$body" > /dev/null 2>&1; then
                  result[$i]=fail; detail[$i]="response has no services list"
                else
                  local bad unknown
                  bad=$(jq -r '[.services[] | select(.state != "operational" and .state != "unknown") | "\(.name): \(.state)"] | join("; ")' "$body")
                  unknown=$(jq -r '[.services[] | select(.state == "unknown") | "\(.name): unknown"] | join("; ")' "$body")
                  if [[ -n $bad ]]; then result[$i]=fail; detail[$i]="$bad${unknown:+; $unknown}"
                  elif [[ -n $unknown ]]; then result[$i]=warn; detail[$i]="$unknown"; fi
                fi ;;
            esac
          }

          retry=()
          for i in "${!checks[@]}"; do
            probe "$i"; note[$i]=""
            [[ ${result[$i]} == fail ]] && retry+=("$i")
          done

          if (( ${#retry[@]} )); then
            echo "Retrying ${#retry[@]} failed check(s) in 30 s"
            sleep 30
            for i in "${retry[@]}"; do
              first=${detail[$i]}
              probe "$i"
              if [[ ${result[$i]} == fail ]]; then note[$i]="failed twice"
              else note[$i]="recovered on retry (first try: $first)"; fi
            done
          fi

          failed=0
          {
            echo "## Health check ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            echo
            echo "| Check | Result | HTTP | Time | Detail |"
            echo "|---|---|---|---|---|"
            for i in "${!checks[@]}"; do
              IFS='|' read -r name url kind <<< "${checks[$i]}"
              case ${result[$i]} in
                ok) r="OK" ;; warn) r="WARN" ;; *) r="FAIL"; failed=$((failed + 1)) ;;
              esac
              d=${detail[$i]}; [[ -n ${note[$i]} ]] && d="${d:+$d. }${note[$i]}"
              printf '| [%s](%s) | %s | %s | %.2fs | %s |\n' "$name" "$url" "$r" "${code[$i]}" "${secs[$i]}" "${d//|/\\|}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          for i in "${!checks[@]}"; do
            IFS='|' read -r name url kind <<< "${checks[$i]}"
            case ${result[$i]} in
              ok)   echo "OK    $name" ;;
              warn) echo "::warning title=$name::${detail[$i]}"; echo "WARN  $name: ${detail[$i]}" ;;
              *)    echo "::error title=$name::$url: ${detail[$i]}"; echo "FAIL  $name: ${detail[$i]}" ;;
            esac
          done

          if (( failed )); then
            echo "$failed check(s) failed"
            exit 1
          fi
